<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animuhauzscript Hub - Online Cloud DB</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 15px 70px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; }
    .logo-badge { display: inline-block; background: rgba(225, 29, 72, 0.15); color: #fb7185; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid rgba(225, 29, 72, 0.3); margin-bottom: 8px; }
    h1 { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 6px; }
    p.sub { color: var(--text-muted); font-size: 14px; }

    .top-actions { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box { flex: 1; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    
    .admin-btn { background: var(--accent); color: #fff; border: none; padding: 0 16px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
    .admin-btn:hover { background: var(--accent-hover); }

    /* ADMIN MODAL */
    #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; width: 100%; max-width: 450px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 5px; }
    .save-btn { flex: 1; background: var(--accent); color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .close-btn { background: #334155; color: #fff; border: none; padding: 11px 15px; border-radius: 8px; cursor: pointer; }

    /* SCRIPT CARDS */
    .grid { display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-top h3 { font-size: 17px; color: #fff; }
    .badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .game { color: #38bdf8; font-size: 13px; font-weight: bold; }
    .code-box { background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; color: #34d399; overflow-x: auto; white-space: nowrap; }
    .copy-btn { background: var(--accent); color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .copy-btn:active { background: var(--accent-hover); }

    #toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 14px; transition: 0.3s; z-index: 9999; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .loading { text-align: center; color: var(--text-muted); padding: 40px 0; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-badge">⚡ BULUTLI ONLAYN BAZA</div>
      <h1>Animuhauzscript Hub</h1>
      <p class="sub">Hamma uchun onlayn yangilanib turadigan Roblox skriptlari</p>
    </header>

    <div class="top-actions">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Skript yoki o'yin qidirish..." oninput="filterScripts()">
      <button class="admin-btn" onclick="openAdmin()">+ Skript qo'shish</button>
    </div>

    <div id="loading" class="loading">Yuklanmoqda...</div>
    <div class="grid" id="scriptsContainer"></div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="adminModal">
    <div class="modal-content">
      <h3 style="color:#fff;">Yangi Skript Qo'shish (Admin)</h3>
      <input type="password" id="adminPass" placeholder="Admin Paroli (Standart: 1234)">
      <input type="text" id="scriptTitle" placeholder="Skript Nomi (masalan: Redz Hub)">
      <input type="text" id="scriptGame" placeholder="O'yin Nomi (masalan: Blox Fruits)">
      <textarea id="scriptCode" rows="3" placeholder="loadstring(game:HttpGet(...))()"></textarea>
      
      <div class="modal-actions">
        <button class="close-btn" onclick="closeAdmin()">Yopish</button>
        <button class="save-btn" onclick="saveNewScript()">Bazaga Saqlash 🚀</button>
      </div>
    </div>
  </div>

  <div id="toast">✅ Skript nusxalandi!</div>

  <script>
    // SIZNING RASMIY FIREBASE BAZANGIZ SOZLAMALARI:
    const firebaseConfig = {
      apiKey: "AIzaSyAQ28AjxdgJI7jQ4zrfW0R17J-rlbM6fCk",
      authDomain: "animuhauzscript.firebaseapp.com",
      projectId: "animuhauzscript",
      storageBucket: "animuhauzscript.firebasestorage.app",
      messagingSenderId: "368272899508",
      appId: "1:368272899508:web:62e22b71d1d74a19c306e1",
      measurementId: "G-61G1WJ8EWZ"
    };

    // Firebase'ni ishga tushirish
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allScripts = [];

    // BAZADAN SKRIPTLARNI REAL-TIME HAMMA UCHUN OLISH
    db.collection("scripts").onSnapshot(snapshot => {
      allScripts = [];
      snapshot.forEach(doc => {
        allScripts.push({ id: doc.id, ...doc.data() });
      });
      document.getElementById("loading").style.display = "none";
      renderScripts(allScripts);
    }, error => {
      console.error("Firebase xatosi:", error);
      document.getElementById("loading").innerText = "Skriptlarni yuklashda xatolik yuz berdi.";
    });

    function renderScripts(items) {
      const container = document.getElementById("scriptsContainer");
      if (items.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#94a3b8;'>Hozircha hech qanday skript qo'shilmagan. Yuqoridagi «+ Skript qo'shish» tugmasi orqali birinchi skriptni qo'shing!</p>";
        return;
      }
      container.innerHTML = items.map((s, index) => `
        <div class="card">
          <div class="card-top">
            <h3>${s.title}</h3>
            <span class="badge">✓ Keyless</span>
          </div>
          <div class="game">🎮 ${s.game}</div>
          <div class="code-box">${s.code}</div>
          <button class="copy-btn" onclick="copyScript(${index})">📋 Nusxalash</button>
        </div>
      `).join("");
    }

    function filterScripts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allScripts.filter(s => s.title.toLowerCase().includes(search) || s.game.toLowerCase().includes(search));
      renderScripts(filtered);
    }

    function copyScript(index) {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const currentList = allScripts.filter(s => s.title.toLowerCase().includes(search) || s.game.toLowerCase().includes(search));
      navigator.clipboard.writeText(currentList[index].code).then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      });
    }

    // ADMIN FUNKSIYALARI
    function openAdmin() {
      document.getElementById("adminModal").style.display = "flex";
    }
    function closeAdmin() {
      document.getElementById("adminModal").style.display = "none";
    }

    function saveNewScript() {
      const pass = document.getElementById("adminPass").value;
      const title = document.getElementById("scriptTitle").value.trim();
      const game = document.getElementById("scriptGame").value.trim();
      const code = document.getElementById("scriptCode").value.trim();

      // Admin Paroli: 1234 (Xohlasangiz o'zgartirishingiz mumkin)
      if (pass !== "1234") {
        alert("❌ Noto'g'ri admin paroli!");
        return;
      }
      if (!title || !game || !code) {
        alert("Iltimos, barcha maydonlarni to'ldiring!");
        return;
      }

      db.collection("scripts").add({
        title: title,
        game: game,
        code: code,
        createdAt: new Date().toISOString()
      }).then(() => {
        alert("✅ Skript Google Firebase bazasiga qo'shildi! Endi hamma foydalanuvchilarga ko'rindi!");
        closeAdmin();
        document.getElementById("scriptTitle").value = "";
        document.getElementById("scriptGame").value = "";
        document.getElementById("scriptCode").value = "";
      }).catch(err => {
        alert("Xatolik yuz berdi: " + err.message);
      });
    }
  </script>
</body>
    </html>
